<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E5C158;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3" flood-color="#D4AF37"/>
    </filter>
  </defs>
  
  <!-- Background circle with gold gradient and shadow -->
  <circle cx="100" cy="100" r="100" fill="url(#goldGradient)" filter="url(#shadow)"/>
  
  <!-- "W" letter - bold, centered, black -->
  <text x="100" y="135" font-family="Georgia, serif" font-size="120" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">W</text>
</svg>